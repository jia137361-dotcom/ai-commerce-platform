# Production-oriented compose template.
# Usage:
#   PROD_ENV_FILE=apps/medusa-backend/.env \
#   HEALTHCHECK_URLS="http://127.0.0.1:9000/health http://127.0.0.1:5173/login http://127.0.0.1:3000/" \
#   scripts/prod/deploy.sh
#
# Rules enforced by scripts/prod/*.sh:
# - no `docker compose down`
# - no `git stash --include-untracked`
# - backup + migrate fail hard before service switch
#
# Optional env:
# - MEDUSA_ADMIN_DISABLE=true  (disable Medusa admin UI in production)
# - DATABASE_SSL=false         (local/docker Postgres without SSL)

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medusa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medusa}
      POSTGRES_DB: ${POSTGRES_DB:-ai_commerce}
    volumes:
      - ai_commerce_prod_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medusa} -d ${POSTGRES_DB:-ai_commerce}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  medusa:
    build:
      context: ..
      dockerfile: apps/medusa-backend/Dockerfile
      provenance: false
    restart: unless-stopped
    env_file:
      - ../apps/medusa-backend/.env
    environment:
      NODE_ENV: production
      AI_WORKER_BASE_URL: ${AI_WORKER_BASE_URL:-http://ai-worker:8001}
      MEDUSA_ADMIN_DISABLE: ${MEDUSA_ADMIN_DISABLE:-true}
      DATABASE_SSL: ${DATABASE_SSL:-false}
    ports:
      - "${MEDUSA_HOST_PORT:-9000}:9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-worker:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s

  ai-worker:
    build:
      context: ../apps/ai-worker
      dockerfile: Dockerfile.prod
      provenance: false
    restart: unless-stopped
    env_file:
      - ../apps/medusa-backend/.env
    environment:
      AI_WORKER_HOST: 0.0.0.0
      AI_WORKER_PORT: 8001
      AI_WORKER_MOCK_GENERATION: ${AI_WORKER_MOCK_GENERATION:-false}
      MEDUSA_BASE_URL: ${MEDUSA_BASE_URL:-http://medusa:9000}
      AI_WORKER_UPLOAD_DIR: /app/uploads
      AI_WORKER_PUBLIC_BASE_URL: ${AI_WORKER_PUBLIC_BASE_URL:-http://127.0.0.1:8001/static}
    ports:
      - "${AI_WORKER_HOST_PORT:-8001}:8001"
    volumes:
      - ai_commerce_prod_ai_uploads:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import httpx; httpx.get('http://127.0.0.1:8001/health', timeout=5).raise_for_status()",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  seller-dashboard:
    build:
      context: ..
      dockerfile: apps/seller-dashboard/Dockerfile
      provenance: false
      args:
        VITE_MEDUSA_URL: ${VITE_MEDUSA_URL:-http://127.0.0.1:9000}
        VITE_STOREFRONT_URL: ${VITE_STOREFRONT_URL:-http://127.0.0.1:3000}
        VITE_STORE_ID: ${VITE_STORE_ID:-default_store}
        VITE_PUBLISHABLE_API_KEY: ${VITE_PUBLISHABLE_API_KEY:-}
    restart: unless-stopped
    ports:
      - "${SELLER_HOST_PORT:-5173}:80"
    depends_on:
      medusa:
        condition: service_healthy

  storefront:
    build:
      context: ..
      dockerfile: apps/storefront/Dockerfile
      provenance: false
      args:
        VITE_MEDUSA_BASE_URL: ${VITE_MEDUSA_BASE_URL:-http://127.0.0.1:9000}
        VITE_STORE_ID: ${VITE_STORE_ID:-default_store}
        VITE_PUBLISHABLE_API_KEY: ${VITE_PUBLISHABLE_API_KEY:-}
    restart: unless-stopped
    ports:
      - "${STOREFRONT_HOST_PORT:-3000}:80"
    depends_on:
      medusa:
        condition: service_healthy

volumes:
  ai_commerce_prod_pg:
  ai_commerce_prod_ai_uploads:
