# Production-oriented compose template.
# Usage:
#   PROD_ENV_FILE=apps/medusa-backend/.env \
#   HEALTHCHECK_URLS="http://127.0.0.1:9000/health http://127.0.0.1:5173/login http://127.0.0.1:3000/" \
#   scripts/prod/deploy.sh
#
# Rules enforced by scripts/prod/*.sh:
# - no `docker compose down`
# - no `git stash --include-untracked`
# - backup + migrate fail hard before service switch

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medusa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medusa}
      POSTGRES_DB: ${POSTGRES_DB:-ai_commerce}
    volumes:
      - ai_commerce_prod_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medusa} -d ${POSTGRES_DB:-ai_commerce}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  medusa:
    build:
      context: ..
      dockerfile: apps/medusa-backend/Dockerfile
    restart: unless-stopped
    env_file:
      - ../apps/medusa-backend/.env
    environment:
      NODE_ENV: production
    ports:
      - "${MEDUSA_HOST_PORT:-9000}:9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s

  seller-dashboard:
    build:
      context: ..
      dockerfile: apps/seller-dashboard/Dockerfile
      args:
        VITE_MEDUSA_URL: ${VITE_MEDUSA_URL:-http://127.0.0.1:9000}
        VITE_STOREFRONT_URL: ${VITE_STOREFRONT_URL:-http://127.0.0.1:3000}
        VITE_STORE_ID: ${VITE_STORE_ID:-default_store}
    restart: unless-stopped
    ports:
      - "${SELLER_HOST_PORT:-5173}:80"
    depends_on:
      medusa:
        condition: service_healthy

  storefront:
    build:
      context: ..
      dockerfile: apps/storefront/Dockerfile
      args:
        VITE_MEDUSA_BASE_URL: ${VITE_MEDUSA_BASE_URL:-http://127.0.0.1:9000}
        VITE_STORE_ID: ${VITE_STORE_ID:-default_store}
    restart: unless-stopped
    ports:
      - "${STOREFRONT_HOST_PORT:-3000}:80"
    depends_on:
      medusa:
        condition: service_healthy

volumes:
  ai_commerce_prod_pg:
