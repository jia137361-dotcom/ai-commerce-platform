services:
  postgres:
    image: postgres:16
    container_name: ai-commerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa
      POSTGRES_DB: ai_commerce
    ports:
      - "5432:5432"
    volumes:
      - ai-commerce-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: ai-commerce-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  ai-commerce-postgres:

