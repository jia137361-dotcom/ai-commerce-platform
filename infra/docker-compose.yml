services:
  postgres:
    image: postgres:16
    container_name: ai-commerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa
      POSTGRES_DB: ai_commerce
    ports:
      - "5433:5432"
    volumes:
      - ai-commerce-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: ai-commerce-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: ai-commerce-libretranslate
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      LT_LOAD_ONLY: en,zh,es,fr,de,ja,ko,pt,ar
    volumes:
      - ai-commerce-lt-models:/app/db

volumes:
  ai-commerce-postgres:
  ai-commerce-lt-models:

